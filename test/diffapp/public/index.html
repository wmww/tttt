<!DOCTYPE html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <link rel=stylesheet href='index.css'>
    <meta name=viewport content='width=device-width, initial-scale=1, user-scalable=1'>
    <title>tttt diffapp</title>
  </head>
  <body>
    <div id='root' class='v-box'>
      <div id='error-list'>
        <template id='error-template'>
          <div class='error-box'>
            <p id='error-message'></p>
          </div>
        </template>
      </div>
      <div class='h-box'>
        <div style='display: flex;'>
          <button id='channel-button-err' class='channel-button'>Errors</button>
          <button id='channel-button-sym' class='channel-button'>Symbols</button>
          <button id='channel-button-typ' class='channel-button'>Types</button>
        </div>
      </div>
      <textarea id='main-text' class='code-view code-container' spellcheck=false></textarea>
      <div class='h-box code-container'>
        <textarea id='left-text' class='code-view code-container' disabled=true spellcheck=false></textarea>
        <textarea id='right-text' class='code-view code-container' disabled=true spellcheck=false></textarea>
      </div>
    </div>
    <noscript>WARNING: JavaScript is required</noscript>
    <script src='index.js'></script>
  </body>
</html>
