<!DOCTYPE html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <link rel=stylesheet href='index.css'>
    <meta name=viewport content='width=device-width, initial-scale=1, user-scalable=1'>
    <title>tttt diffapp</title>
  </head>
  <body>
    <div id='root' class='v-box'>
      <div id='error-list'>
        <template id='error-template'>
          <div class='error-box'><p id='error-message'></p></div>
        </template>
      </div>
      <div class='header-box'>
        <div class='floating-box'>
          <button class='floating-button' id='back-button'>⮜</button>
          <button class='floating-button' id='forward-button'>⮞</button>
        </div>
        <div class='tab-box'>
          <button id='channel-button-err' class='channel-button'>Errors</button>
          <button id='channel-button-sym' class='channel-button'>Symbols</button>
          <button id='channel-button-typ' class='channel-button'>Types</button>
        </div>
        <!--div class='floating-box'>
          <button class='floating-button'>☰</button>
        </div-->
      </div>
      <textarea id='code-input'></textarea>
      <div class='token-view-container' id='code-view-container'>
        <div class='token-view' id='code-view'></div>
      </div>
      <div class='token-view-container' id='stderr-view-container'>
        <div class='token-view' id='stderr-view'></div>
      </div>
    </div>
    <noscript>WARNING: JavaScript is required</noscript>
    <script src='diff.js'></script>
    <script src='tokens.js'></script>
    <script src='editor.js'></script>
    <script src='annotated_editor.js'></script>
    <script src='sync.js'></script>
    <script src='index.js'></script>
  </body>
</html>
